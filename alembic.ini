# Alembic configuration for radbrain. Runtime and migrator URLs are supplied
# through DATABASE_MIGRATOR_URL; no credential belongs in this file.
[alembic]
script_location = %(here)s/apps/api/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = postgresql+asyncpg://radbrain_migrator@localhost/radbrain

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
